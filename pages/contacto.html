<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
      <link rel="stylesheet" href="/styles.css">
    <title>Contacto</title>
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-5">

                <div class="card shadow-sm p-4 text-white" style="background-color:#1f1a33;">
                    <h3 class="text-center mb-3">Contacto</h3>
                    <p class="text-center text-secondary mb-4">
                        <i class="bi bi-geo-alt me-1"></i> General paz 576, Tucuman, Argentina
                    </p>

                    <form action="../Error404/error404.html">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Nombre y Apellido" required
                                minlength="3" pattern="[A-Za-zÀ-ÿ\s]+" title="Solo se permiten letras">
                        </div>

                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" required>
                        </div>

                        <div class="mb-3">
                            <textarea class="form-control" rows="4" placeholder="Tu consulta" required
                                minlength="10"></textarea>
                        </div>

                        <a href="../Error404/error404.html" class="btn btn-outline-light w-100">Enviar consulta</a>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
